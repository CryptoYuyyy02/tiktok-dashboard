<!DOCTY
            animation:false,PE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok 数据看板</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans SC', 'Space Grotesk', sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #ffffff20; border-radius: 99px; }

    .dashboard { min-height: 100vh; background: #0a0a0f; background-image: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0,242,234,0.06) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255,0,80,0.06) 0%, transparent 60%); }

    .header { display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 64px; background: rgba(10,10,15,0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); position: sticky; top: 0; z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .header-title { font-size: 16px; font-weight: 700; color: #fff; }
    .header-sub { font-size: 11px; color: rgba(255,255,255,0.4); }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .search-box { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 7px 12px; color: #e0e0e0; font-size: 13px; outline: none; width: 180px; transition: border 0.2s; }
    .search-box::placeholder { color: rgba(255,255,255,0.3); }
    .search-box:focus { border-color: #ff0050; }
    .filter-select { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 7px 12px; color: #e0e0e0; font-size: 13px; outline: none; cursor: pointer; }
    .add-btn { background: linear-gradient(135deg,#00f2ea,#ff0050); border: none; border-radius: 8px; padding: 8px 16px; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; transition: opacity 0.2s; }
    .add-btn:hover { opacity: 0.85; }

    .body { padding: 24px 28px; max-width: 1600px; margin: 0 auto; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 28px; }
    .stat-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px 22px; display: flex; align-items: center; gap: 16px; transition: all 0.3s; position: relative; overflow: hidden; cursor: default; }
    .stat-card:hover { background: rgba(255,255,255,0.07); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.15); }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .stat-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .stat-label { font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-value { font-size: 26px; font-weight: 700; color: #fff; font-family: 'Space Grotesk', sans-serif; line-height: 1.1; }
    .stat-trend { font-size: 11px; margin-top: 4px; }
    .trend-up { color: #52c41a; }
    .trend-down { color: #ff4d4f; }

    /* Section */
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-title { font-size: 14px; font-weight: 600; color: #fff; }
    .section-sub { font-size: 11px; color: rgba(255,255,255,0.35); }

    /* Account Grid */
    .account-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 12px; margin-bottom: 24px; }
    .account-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; cursor: pointer; transition: all 0.25s; position: relative; }
    .account-card:hover { border-color: rgba(255,255,255,0.18); transform: translateY(-1px); }
    .account-card.active { border-color: #ff0050; background: rgba(255,0,80,0.08); box-shadow: 0 0 0 1px #ff005060, 0 8px 24px rgba(255,0,80,0.15); }
    .account-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .account-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); }
    .account-name { font-size: 13px; font-weight: 600; color: #fff; }
    .account-user { font-size: 11px; color: rgba(255,255,255,0.4); }
    .account-badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 500; }
    .badge-active { background: rgba(82,196,26,0.15); color: #52c41a; }
    .badge-dormant { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); }
    .account-metrics { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .ametric { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .ametric-lbl { font-size: 10px; color: rgba(255,255,255,0.35); }
    .ametric-val { font-size: 13px; font-weight: 600; color: #fff; }
    .account-bar { height: 3px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; }
    .account-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg,#00f2ea,#ff0050); transition: width 0.5s ease; }

    /* Detail Panel */
    .detail-panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 18px; padding: 22px; }
    .detail-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
    .detail-profile { display: flex; align-items: center; gap: 14px; }
    .detail-avatar { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #ff0050; }
    .detail-name { font-size: 16px; font-weight: 700; color: #fff; }
    .detail-user { font-size: 12px; color: rgba(255,255,255,0.4); }
    .detail-metrics { display: flex; gap: 32px; flex-wrap: wrap; }
    .dm { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .dm-val { font-size: 18px; font-weight: 700; color: #fff; font-family: 'Space Grotesk', sans-serif; }
    .dm-lbl { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Charts */
    .charts-row { display: grid; grid-template-columns: 1fr 1.5fr; gap: 14px; margin-bottom: 14px; }
    .chart-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px; }
    .chart-title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
    .chart-tag { background: rgba(255,0,80,0.15); color: #ff0050; font-size: 10px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
    .chart-refresh { background: rgba(255,255,255,0.06); border: none; border-radius: 6px; padding: 4px 10px; color: rgba(255,255,255,0.6); font-size: 11px; cursor: pointer; }

    /* Table */
    .table-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px; }
    .table-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .video-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .video-table th { text-align: left; padding: 8px 12px; color: rgba(255,255,255,0.4); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.06); font-weight: 500; }
    .video-table td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); color: rgba(255,255,255,0.8); }
    .video-table tr:last-child td { border-bottom: none; }
    .video-table tr:hover td { background: rgba(255,255,255,0.02); }
    .video-title { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
    .tag-views { background: rgba(0,242,234,0.15); color: #00f2ea; }
    .tag-likes { background: rgba(255,0,80,0.15); color: #ff6680; }
    .tag-comments { background: rgba(124,58,237,0.15); color: #a78bfa; }
    .tag-shares { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .eng-rate { font-weight: 600; }
    .eng-high { color: #52c41a; }
    .eng-mid { color: #faad14; }
    .eng-low { color: #ff4d4f; }
    .post-time { color: rgba(255,255,255,0.3); font-size: 11px; }

    @media (max-width: 900px) { .stats-row { grid-template-columns: repeat(2,1fr); } .charts-row { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { .stats-row { grid-template-columns: 1fr; } .header { padding: 0 16px; } .body { padding: 16px; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── Data ──────────────────────────────────────────
    const ACCOUNTS = [
      { id:1, username:'@fashionista_ella', nickname:'Ella时尚日记', avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=ella&backgroundColor=b6e3f4', followers:284750, videos:342, likes:1950000, avgViews:48500, engagement:6.8, status:'active' },
      { id:2, username:'@fitness_mike', nickname:'Mike健身干货', avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=mike&backgroundColor=c0aede', followers:156200, videos:218, likes:890000, avgViews:32100, engagement:5.2, status:'active' },
      { id:3, username:'@foodie_chen', nickname:'陈好吃的探店', avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=chen&backgroundColor=d1d4f9', followers:523100, videos:487, likes:4200000, avgViews:89200, engagement:8.4, status:'active' },
      { id:4, username:'@travel_bunny', nickname:'旅行兔Rabbit', avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=bunny&backgroundColor=ffd5dc', followers:98700, videos:156, likes:620000, avgViews:27800, engagement:4.9, status:'active' },
      { id:5, username:'@comedy_king_88', nickname:'段子王88', avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=king88&backgroundColor=ffdfbf', followers:1250000, videos:623, likes:15800000, avgViews:210000, engagement:9.1, status:'active' },
      { id:6, username:'@pet_paradise', nickname:'萌宠星球', avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=pets&backgroundColor=c0aede', followers:342800, videos:298, likes:3100000, avgViews:62000, engagement:7.3, status:'active' },
      { id:7, username:'@tech_guru_li', nickname:'李老师讲数码', avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=liguru&backgroundColor=b6e3f4', followers:78900, videos:134, likes:480000, avgViews:19800, engagement:5.6, status:'dormant' },
      { id:8, username:'@dance_studio_pro', nickname:'舞蹈工作室Pro', avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=dance&backgroundColor=ffd5dc', followers:201500, videos:267, likes:1800000, avgViews:41200, engagement:6.1, status:'active' },
    ];

    const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);

    const genTrend = (base) => {
      const days = [];
      let cur = base - Math.floor(Math.random()*5000+2000);
      for(let i=29;i>=0;i--){
        const d = new Date(); d.setDate(d.getDate()-i);
        const delta = Math.floor((Math.random()-0.28)*320+50);
        cur = Math.max(cur+delta, base*0.88);
        days.push({ date: `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, followers:cur, delta });
      }
      return days;
    };

    const genVideos = (nickname) => {
      const topics=['日常分享','干货教程','好物推荐','搞笑合集','挑战赛','热点评论','产品测评','生活vlog'];
      return Array.from({length:12},(_,i)=>{
        const views=Math.floor(Math.random()*500000+8000);
        const likes=Math.floor(views*(Math.random()*0.09+0.02));
        const comments=Math.floor(views*(Math.random()*0.005+0.001));
        const shares=Math.floor(views*(Math.random()*0.003+0.001));
        const d=new Date(); d.setDate(d.getDate()-Math.floor(Math.random()*28));
        const eng=((likes+comments+shares)/views*100).toFixed(1);
        return { id:i, title:`${nickname} · 第${i+1}期 · ${topics[Math.floor(Math.random()*topics.length)]}`, views, likes, comments, shares, eng, date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` };
      }).sort((a,b)=>b.views-a.views);
    };

    const GLOBAL = {
      totalAccounts: ACCOUNTS.length,
      totalFollowers: ACCOUNTS.reduce((s,a)=>s+a.followers,0),
      totalVideos: ACCOUNTS.reduce((s,a)=>s+a.videos,0),
      avgEng: (ACCOUNTS.reduce((s,a)=>s+a.engagement,0)/ACCOUNTS.length).toFixed(1),
      active: ACCOUNTS.filter(a=>a.status==='active').length,
    };

    // ── Chart Components ──
    let trendChart = null;
    let barChart = null;

    const FollowerTrendChart = ({ data, containerId }) => {
      const ref = useRef();
      useEffect(() => {
        if(trendChart){ trendChart.destroy(); trendChart=null; }
        const ctx = ref.current.getContext('2d');
        const grad = ctx.createLinearGradient(0,0,0,160);
        grad.addColorStop(0,'rgba(255,0,80,0.35)');
        grad.addColorStop(1,'rgba(255,0,80,0)');
        trendChart = new Chart(ctx, {
          type:'line',
          data:{
            labels: data.map(d=>d.date),
            datasets:[{
              data: data.map(d=>d.followers),
              borderColor:'#ff0050',
              borderWidth:2,
              fill:true,
              backgroundColor:grad,
              tension:0.4,
              pointRadius:0,
              pointHoverRadius:4,
              pointHoverBackgroundColor:'#ff0050',
            }]
          },
          options:{
            responsive:true,
            maintainAspectRatio:false,
            plugins:{ legend:{ display:false }, tooltip:{
              backgroundColor:'#1a1a2e',
              borderColor:'rgba(255,255,255,0.1)',
              borderWidth:1,
              titleColor:'#fff',
              bodyColor:'rgba(255,255,255,0.7)',
              callbacks:{ label: ctx=>`粉丝: ${ctx.raw.toLocaleString()}` }
            }},
            scales:{
              x:{ grid:{ color:'rgba(255,255,255,0.04)' }, ticks:{ color:'rgba(255,255,255,0.4)', font:{size:10}, maxTicksLimit:8 } },
              y:{ grid:{ color:'rgba(255,255,255,0.04)' }, ticks:{ color:'rgba(255,255,255,0.4)', font:{size:10}, callback:v=>v>=1000?`${(v/1000).toFixed(0)}k`:v } }
            }
          }
        });
        return ()=>{ if(trendChart){ trendChart.destroy(); trendChart=null; } };
      }, [data]);
      return <canvas ref={ref} style={{height:130}}/>;
    };

    const VideoBarChart = ({ videos, containerId }) => {
      const ref = useRef();
      useEffect(() => {
        if(barChart){ barChart.destroy(); barChart=null; }
        const ctx = ref.current.getContext('2d');
        barChart = new Chart(ctx, {
          type:'bar',
          data:{
            labels: videos.slice(0,7).map(v=>v.title.length>12?v.title.slice(0,12)+'…':v.title),
            datasets:[
              { label:'播放', data:videos.slice(0,7).map(v=>v.views), backgroundColor:'rgba(0,242,234,0.7)', borderRadius:4, borderSkipped:false },
              { label:'点赞', data:videos.slice(0,7).map(v=>v.likes), backgroundColor:'rgba(255,0,80,0.7)', borderRadius:4, borderSkipped:false },
            ]
          },
          options:{
            animation:false,
            responsive:true,
            maintainAspectRatio:false,
            plugins:{ legend:{ labels:{ color:'rgba(255,255,255,0.6)', font:{size:11}, boxWidth:10 } } },
            scales:{
              x:{ grid:{ display:false }, ticks:{ color:'rgba(255,255,255,0.4)', font:{size:9} } },
              y:{ grid:{ color:'rgba(255,255,255,0.04)' }, ticks:{ color:'rgba(255,255,255,0.4)', font:{size:10}, callback:v=>v>=1000?`${(v/1000).toFixed(0)}k`:v } }
            }
          }
        });
        return ()=>{ if(barChart){ barChart.destroy(); barChart=null; } };
      }, [videos]);
      return <canvas ref={ref} style={{height:160}}/>;
    };

    // ── Main App ──
    const App = () => {
      const [selected, setSelected] = useState(ACCOUNTS[0]);
      const [search, setSearch] = useState('');
      const [filter, setFilter] = useState('all');
      const [trend, setTrend] = useState(genTrend(ACCOUNTS[0].followers));
      const [videos, setVideos] = useState(genVideos(ACCOUNTS[0].nickname));

      const selectAccount = (acc) => {
        setSelected(acc);
        setTrend(genTrend(acc.followers));
        setVideos(genVideos(acc.nickname));
      };

      const filtered = ACCOUNTS.filter(a => {
        const matchS = a.nickname.toLowerCase().includes(search.toLowerCase()) || a.username.toLowerCase().includes(search.toLowerCase());
        const matchF = filter==='all' || a.status===filter;
        return matchS && matchF;
      });

      const engClass = e => e>6?'eng-high':e>4?'eng-mid':'eng-low';
      const lastDelta = trend[trend.length-1]?.delta || 0;

      return (
        <div className="dashboard">
          {/* Header */}
          <div className="header">
            <div className="header-left">
              <div className="logo" style={{background:'linear-gradient(135deg,#00f2ea22,#ff005022)',border:'1px solid rgba(255,255,255,0.08)'}}>
                <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
                  <circle cx="14" cy="14" r="14" fill="url(#lg)"/>
                  <path d="M19.5 10.5C19.5 10.5 20.5 12.8 20.5 14C20.5 15.2 19.5 17.5 19.5 17.5" stroke="#fff" strokeWidth="2" strokeLinecap="round"/>
                  <circle cx="14" cy="14" r="1.5" fill="#fff"/>
                  <circle cx="8.5" cy="14" r="1.5" fill="#fff"/>
                  <defs><linearGradient id="lg" x1="0" y1="0" x2="28" y2="28"><stop stopColor="#00f2ea"/><stop offset="1" stopColor="#ff0050"/></linearGradient></defs>
                </svg>
              </div>
              <div>
                <div className="header-title">TikTok 数据看板</div>
                <div className="header-sub">多账号运营监控平台</div>
              </div>
            </div>
            <div className="header-right">
              <input className="search-box" placeholder="搜索账号…" value={search} onChange={e=>setSearch(e.target.value)}/>
              <select className="filter-select" value={filter} onChange={e=>setFilter(e.target.value)}>
                <option value="all">全部账号</option>
                <option value="active">活跃</option>
                <option value="dormant">沉寂</option>
              </select>
              <button className="add-btn">+ 添加账号</button>
            </div>
          </div>

          {/* Body */}
          <div className="body">
            {/* Stats */}
            <div className="stats-row">
              <div className="stat-card" style={{'--accent':'#00f2ea'}}>
                <div className="stat-icon" style={{background:'rgba(0,242,234,0.12)'}}>👥</div>
                <div>
                  <div className="stat-label">监控账号</div>
                  <div className="stat-value">{GLOBAL.totalAccounts}</div>
                  <div className="stat-trend trend-up">↑ {GLOBAL.active} 个活跃中</div>
                </div>
              </div>
              <div className="stat-card" style={{'--accent':'#ff0050'}}>
                <div className="stat-icon" style={{background:'rgba(255,0,80,0.12)'}}>🎯</div>
                <div>
                  <div className="stat-label">总粉丝量</div>
                  <div className="stat-value">{fmt(GLOBAL.totalFollowers)}</div>
                  <div className="stat-trend trend-up">↑ +{fmt(12400+Math.floor(Math.random()*3000))} 今日</div>
                </div>
              </div>
              <div className="stat-card" style={{'--accent':'#7c3aed'}}>
                <div className="stat-icon" style={{background:'rgba(124,58,237,0.12)'}}>🎬</div>
                <div>
                  <div className="stat-label">总作品数</div>
                  <div className="stat-value">{GLOBAL.totalVideos.toLocaleString()}</div>
                  <div className="stat-trend trend-up">↑ +{18+Math.floor(Math.random()*8)} 本周新增</div>
                </div>
              </div>
              <div className="stat-card" style={{'--accent':'#f59e0b'}}>
                <div className="stat-icon" style={{background:'rgba(245,158,11,0.12)'}}>💬</div>
                <div>
                  <div className="stat-label">平均互动率</div>
                  <div className="stat-value">{GLOBAL.avgEng}%</div>
                  <div className="stat-trend trend-up">↑ +0.3% 较上周</div>
                </div>
              </div>
            </div>

            {/* Account Grid */}
            <div className="section-head">
              <span className="section-title">📋 账号列表</span>
              <span className="section-sub">点击账号查看详情</span>
            </div>
            <div className="account-grid">
              {filtered.map(a => (
                <div key={a.id} className={`account-card ${selected.id===a.id?'active':''}`} onClick={()=>selectAccount(a)}>
                  <div className="account-card-top">
                    <img className="account-avatar" src={a.avatar} alt={a.nickname}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div className="account-name">{a.nickname}</div>
                      <div className="account-user">{a.username}</div>
                    </div>
                    <span className={`account-badge ${a.status==='active'?'badge-active':'badge-dormant'}`}>
                      {a.status==='active'?'活跃':'沉寂'}
                    </span>
                  </div>
                  <div className="account-metrics">
                    <div className="ametric"><span className="ametric-lbl">粉丝</span><span className="ametric-val">{fmt(a.followers)}</span></div>
                    <div className="ametric"><span className="ametric-lbl">作品</span><span className="ametric-val">{a.videos}</span></div>
                    <div className="ametric"><span className="ametric-lbl">互动率</span><span className={`ametric-val ${engClass(a.engagement)}`}>{a.engagement}%</span></div>
                  </div>
                  <div className="account-bar"><div className="account-bar-fill" style={{width:`${Math.min(a.engagement*10,100)}%`}}/></div>
                </div>
              ))}
            </div>

            {/* Detail Panel */}
            <div className="detail-panel">
              <div className="detail-top">
                <div className="detail-profile">
                  <img className="detail-avatar" src={selected.avatar} alt=""/>
                  <div>
                    <div className="detail-name">{selected.nickname}</div>
                    <div className="detail-user">{selected.username} · {selected.videos} 个作品</div>
                  </div>
                </div>
                <div className="detail-metrics">
                  <div className="dm"><span className="dm-val" style={{color:'#00f2ea'}}>{fmt(selected.followers)}</span><span className="dm-lbl">粉丝</span></div>
                  <div className="dm"><span className="dm-val" style={{color:'#7c3aed'}}>{selected.videos}</span><span className="dm-lbl">作品</span></div>
                  <div className="dm"><span className="dm-val" style={{color:'#ff0050'}}>{fmt(selected.likes)}</span><span className="dm-lbl">总赞</span></div>
                  <div className="dm"><span className="dm-val" style={{color:'#f59e0b'}}>{selected.engagement}%</span><span className="dm-lbl">互动率</span></div>
                </div>
              </div>

              <div className="charts-row">
                <div className="chart-card">
                  <div className="chart-title">
                    📈 粉丝趋势（近30天）
                    <span className="chart-tag">+{lastDelta>=0?'+':''}{lastDelta.toLocaleString()}</span>
                  </div>
                  <FollowerTrendChart data={trend} containerId="trend"/>
                </div>
                <div className="chart-card">
                  <div className="chart-title">
                    🎬 作品播放 TOP7
                    <button className="chart-refresh" onClick={()=>{ setTrend(genTrend(selected.followers)); setVideos(genVideos(selected.nickname)); }}>↻ 刷新</button>
                  </div>
                  <VideoBarChart videos={videos} containerId="bar"/>
                </div>
              </div>

              <div className="table-card">
                <div className="table-head">
                  <span className="chart-title" style={{margin:0}}>📋 作品列表</span>
                  <div style={{display:'flex',gap:8}}>
                    <button className="chart-refresh">+ 添加监控</button>
                    <button className="chart-refresh" style={{color:'#ff4d4f'}}>🗑 删除账号</button>
                  </div>
                </div>
                <table className="video-table">
                  <thead><tr>
                    <th>标题</th><th>播放</th><th>点赞</th><th>评论</th><th>分享</th><th>互动率</th><th>发布日期</th>
                  </tr></thead>
                  <tbody>
                    {videos.slice(0,8).map(v=>(
                      <tr key={v.id}>
                        <td className="video-title">{v.title}</td>
                        <td><span className="cell-tag tag-views">{fmt(v.views)}</span></td>
                        <td><span className="cell-tag tag-likes">{fmt(v.likes)}</span></td>
                        <td><span className="cell-tag tag-comments">{fmt(v.comments)}</span></td>
                        <td><span className="cell-tag tag-shares">{fmt(v.shares)}</span></td>
                        <td><span className={`eng-rate ${engClass(v.eng)}`}>{v.eng}%</span></td>
                        <td><span className="post-time">{v.date}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
